<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Sketch de calculadora científica</title>
  <desc id="desc">Wireframe con dos entradas numéricas, operaciones básicas, potencia, raíz cuadrada, resultado, mensaje de error y botón limpiar.</desc>
  <rect width="1000" height="900" fill="#ffffff"/>
  <rect x="200" y="70" width="600" height="750" rx="24" fill="#f5f8ff" stroke="#b9c9ed" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#173783">Calculadora científica</text>
  <text x="500" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53617b">Club de estudio</text>
  <g font-family="Arial,sans-serif">
    <text x="250" y="245" font-size="15" font-weight="700" fill="#172544">Primer número</text>
    <rect x="250" y="255" width="500" height="52" rx="8" fill="#fff" stroke="#b9c9ed"/>
    <text x="268" y="287" font-size="14" fill="#66738d">Ingresar primer número</text>
    <text x="250" y="355" font-size="15" font-weight="700" fill="#172544">Segundo número</text>
    <rect x="250" y="365" width="500" height="52" rx="8" fill="#fff" stroke="#b9c9ed"/>
    <text x="268" y="397" font-size="14" fill="#66738d">Ingresar segundo número</text>
    <g fill="#315edb" stroke="#244fc5"><rect x="250" y="450" width="115" height="50" rx="9"/><rect x="380" y="450" width="115" height="50" rx="9"/><rect x="510" y="450" width="145" height="50" rx="9"/><rect x="670" y="450" width="115" height="50" rx="9"/></g>
    <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="307" y="481">Suma</text><text x="437" y="481">Resta</text><text x="582" y="481">Multiplicación</text><text x="727" y="481">División</text></g>
    <g fill="#7798ef" stroke="#315edb"><rect x="315" y="520" width="210" height="50" rx="9"/><rect x="545" y="520" width="210" height="50" rx="9"/></g>
    <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="420" y="551">Potencia</text><text x="650" y="551">Raíz cuadrada</text></g>
    <text x="250" y="625" font-size="15" font-weight="700" fill="#172544">Resultado</text>
    <rect x="250" y="635" width="500" height="65" rx="8" fill="#fff" stroke="#b9c9ed"/>
    <text x="500" y="677" text-anchor="middle" font-size="25" font-weight="700" fill="#173783">—</text>
    <text x="500" y="732" text-anchor="middle" font-size="13" fill="#b42318">Los mensajes de error aparecerán aquí</text>
    <rect x="400" y="755" width="200" height="45" rx="9" fill="#fff" stroke="#315edb" stroke-width="2"/>
    <text x="500" y="783" text-anchor="middle" font-size="14" font-weight="700" fill="#315edb">Limpiar</text>
  </g>
</svg>
