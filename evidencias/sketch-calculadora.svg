<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Sketch de calculadora científica</title>
  <desc id="desc">Wireframe con dos entradas numéricas, operaciones básicas, potencia, raíz cuadrada, resultado, mensaje de error y botón limpiar.</desc>
  <rect width="1000" height="900" fill="#fff9fc"/>
  <circle cx="165" cy="120" r="70" fill="#f6c7d8" opacity=".65"/>
  <path d="M790 110c54-58 131-11 99 55-23 48-91 53-120 11-18-27-7-46 21-66Z" fill="#d9c3ec" opacity=".7"/>
  <path d="M145 725c61-40 107 4 86 60-15 40-77 47-107 13-23-26-12-51 21-73Z" fill="#f3a6b8" opacity=".42"/>
  <rect x="200" y="70" width="600" height="750" rx="36" fill="#fff4fb" stroke="#d9b7e8" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#6f3d7d">Calculadora científica</text>
  <text x="500" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#8c607b">Club de estudio ✦</text>
  <g font-family="Arial,sans-serif">
    <text x="250" y="245" font-size="15" font-weight="700" fill="#55304f">Primer número</text>
    <rect x="250" y="255" width="500" height="52" rx="14" fill="#fffdfd" stroke="#d9b7e8"/>
    <text x="268" y="287" font-size="14" fill="#95718b">Ingresar primer número</text>
    <text x="250" y="355" font-size="15" font-weight="700" fill="#55304f">Segundo número</text>
    <rect x="250" y="365" width="500" height="52" rx="14" fill="#fffdfd" stroke="#d9b7e8"/>
    <text x="268" y="397" font-size="14" fill="#95718b">Ingresar segundo número</text>
    <g fill="#8f5f9f" stroke="#744581"><rect x="250" y="450" width="115" height="50" rx="15"/><rect x="380" y="450" width="115" height="50" rx="15"/><rect x="510" y="450" width="145" height="50" rx="15"/><rect x="670" y="450" width="115" height="50" rx="15"/></g>
    <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="307" y="481">Suma</text><text x="437" y="481">Resta</text><text x="582" y="481">Multiplicación</text><text x="727" y="481">División</text></g>
    <g fill="#e98b9e" stroke="#ce6d82"><rect x="315" y="520" width="210" height="50" rx="15"/><rect x="545" y="520" width="210" height="50" rx="15"/></g>
    <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="420" y="551">Potencia</text><text x="650" y="551">Raíz cuadrada</text></g>
    <text x="250" y="625" font-size="15" font-weight="700" fill="#55304f">Resultado</text>
    <rect x="250" y="635" width="500" height="65" rx="14" fill="#fffdfd" stroke="#d9b7e8"/>
    <text x="500" y="677" text-anchor="middle" font-size="25" font-weight="700" fill="#6f3d7d">—</text>
    <text x="500" y="732" text-anchor="middle" font-size="13" fill="#bb3f68">Los mensajes de error aparecerán aquí</text>
    <rect x="400" y="755" width="200" height="45" rx="15" fill="#fffdfd" stroke="#8f5f9f" stroke-width="2"/>
    <text x="500" y="783" text-anchor="middle" font-size="14" font-weight="700" fill="#6f3d7d">Limpiar</text>
  </g>
</svg>
